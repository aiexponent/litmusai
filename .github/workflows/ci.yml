name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: ruff check src/ tests/
      - run: ruff format --check src/ tests/
      - run: mypy --strict src/

  test:
    name: Test (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - name: Run tests (network disabled per NFR-8)
        # Force bash so `\` line-continuation works on Windows runners too.
        # The default Windows shell is PowerShell, where `\` is not a
        # continuation character; that's why this step had been failing on
        # windows-latest. Bash is included on all GitHub-hosted runners.
        shell: bash
        run: |
          python -m pytest tests/ \
            --disable-socket \
            --cov \
            --cov-report=xml \
            --cov-report=term-missing \
            -v
      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.xml

  license-check:
    name: License Compliance (NFR-9)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: licensecheck

  action-self-test:
    name: GitHub Action on the shipped examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Clear example, fail-on red (expect exit 0, verdict clear)
        id: clear
        uses: ./.github/actions/litmusai-screen
        with:
          path: examples/example-clear.yaml
      - name: Red example, fail-on none, SARIF (expect exit 0, verdict red)
        id: red-none
        uses: ./.github/actions/litmusai-screen
        with:
          path: examples/example-red.yaml
          fail-on: none
          output-format: sarif
      - name: Red example, fail-on red (expect exit 1)
        id: red-gate
        continue-on-error: true
        uses: ./.github/actions/litmusai-screen
        with:
          path: examples/example-red.yaml
      - name: Check verdicts, exit codes and the SARIF file
        env:
          CLEAR_VERDICT: ${{ steps.clear.outputs.verdict }}
          RED_VERDICT: ${{ steps.red-none.outputs.verdict }}
          RED_REPORT: ${{ steps.red-none.outputs.report-path }}
          GATE_OUTCOME: ${{ steps.red-gate.outcome }}
        run: |
          test "$CLEAR_VERDICT" = "clear"
          test "$RED_VERDICT" = "red"
          test "$GATE_OUTCOME" = "failure"
          test "$RED_REPORT" = "litmusai-report.sarif"
          python3 -c "import json; d = json.load(open('$RED_REPORT')); assert d['version'] == '2.1.0' and d['runs'], 'not a SARIF 2.1.0 file'"
          echo "Action self-test passed: clear=$CLEAR_VERDICT red=$RED_VERDICT gate=$GATE_OUTCOME report=$RED_REPORT"
