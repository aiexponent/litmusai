name: Release

# Trigger: pushing a tag matching v*.*.* (e.g. v1.0.0, v1.0.1, v1.1.0).
# This workflow:
#   1. Re-runs the full quality-gate suite as a guard
#   2. Builds wheel + sdist via hatch
#   3. Publishes to PyPI using OIDC trusted-publishing (no API tokens)
#   4. Cuts a GitHub release with the artefacts attached, using
#      docs/release-notes-v<version>.md as the body when present.
#
# Security note: github.ref_name is funnelled through env: in every step,
# never inlined into run: commands. Tag names are validated by Git but
# the env: pattern is the recommended hygiene per
# https://github.blog/security/vulnerability-research/how-to-catch-github-actions-workflow-injections-before-attackers-do/

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write   # cut GitHub releases
  id-token: write   # mint OIDC token for PyPI trusted-publisher

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  guard:
    name: Re-run quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: ruff check src/ tests/
      - run: ruff format --check src/ tests/
      - run: mypy --strict src/
      - name: Run tests with sockets disabled (NFR-8)
        run: pytest tests/ --disable-socket --cov --cov-report=term-missing -v

  build:
    name: Build sdist + wheel
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install build tooling
        run: pip install build
      - name: Build distributions
        run: python -m build
      - name: Verify the wheel installs cleanly + CLI runs
        run: |
          python -m venv /tmp/smoke-env
          /tmp/smoke-env/bin/pip install dist/*.whl
          /tmp/smoke-env/bin/litmus --version
          /tmp/smoke-env/bin/litmus screen --describe "a calculator app for adults"
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish-to-pypi:
    name: Publish to PyPI (OIDC trusted-publisher)
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/litmus-screener
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Publish via OIDC (no API tokens)
        uses: pypa/gh-action-pypi-publish@release/v1
        # Trusted-publishing config required on PyPI side:
        #   pypi.org/manage/account/publishing → Add pending publisher
        #   project name: litmus-screener      (PyPI distribution; brand is "LitmusAI")
        #   owner: aiexponent
        #   repository: litmusai               (GitHub repo; product brand)
        #   workflow: release.yml
        #   environment: pypi

  github-release:
    name: Cut GitHub release
    needs: publish-to-pypi
    runs-on: ubuntu-latest
    env:
      # Funnel the tag through env so it never lands inline in run: scripts.
      TAG_NAME: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Resolve release-note body
        id: notes
        run: |
          set -euo pipefail
          # Strip the leading "v" from the tag to find docs/release-notes-vX.Y.Z.md.
          # TAG_NAME comes from the env block above, never inlined.
          VERSION="${TAG_NAME#v}"
          NOTES_FILE="docs/release-notes-v${VERSION}.md"
          if [[ -f "$NOTES_FILE" ]]; then
            echo "notes_path=$NOTES_FILE" >> "$GITHUB_OUTPUT"
            echo "release_name=${TAG_NAME}: Article 5 screener (UNREVIEWED ruleset, internal panel authored)" >> "$GITHUB_OUTPUT"
            echo "Found release notes at $NOTES_FILE"
          else
            echo "notes_path=" >> "$GITHUB_OUTPUT"
            echo "release_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
            echo "::warning::No release-notes file at $NOTES_FILE; using auto-generated notes"
          fi
      - name: Cut GitHub release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ steps.notes.outputs.release_name }}
          body_path: ${{ steps.notes.outputs.notes_path }}
          generate_release_notes: ${{ steps.notes.outputs.notes_path == '' }}
          files: dist/*
          fail_on_unmatched_files: true

  verify-release:
    name: Independent verification of the released version
    # Runs verification/run.sh against the version just published to PyPI.
    # It fails when the verdicts differ from the published
    # verification/results.csv: the release stays published, and the
    # verification report must be redone for this version.
    needs: publish-to-pypi
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Wait until PyPI serves the new version
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG_NAME#v}"
          # pip reads the JSON form of the simple index, which PyPI's CDN can
          # serve stale for up to 10 minutes after the JSON API already lists
          # the release (v1.2.0: pip found only 1.1.3 twice). Ask for the same
          # representation pip asks for and require three listings in a row.
          seen=0
          for _ in $(seq 1 60); do
            index="$(curl -fsS -H "Accept: application/vnd.pypi.simple.v1+json" \
              "https://pypi.org/simple/litmus-screener/" || true)"
            if [[ "$index" == *"litmus_screener-${VERSION}-py3-none-any.whl"* ]]; then
              seen=$((seen + 1))
              if [ "$seen" -ge 3 ]; then exit 0; fi
            else
              seen=0
            fi
            sleep 20
          done
          echo "The PyPI simple index does not list litmus-screener ${VERSION} after 20 minutes" >&2
          exit 1
      - name: Run verification/run.sh
        env:
          TAG_NAME: ${{ github.ref_name }}
          OUT: ${{ runner.temp }}/verification
        run: verification/run.sh --out "$OUT" --version "${TAG_NAME#v}"
      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-reports
          path: |
            ${{ runner.temp }}/verification/results.csv
            ${{ runner.temp }}/verification/scorecard.md
            ${{ runner.temp }}/verification/scorecard.json
            ${{ runner.temp }}/verification/citations.csv
            ${{ runner.temp }}/verification/errors.txt
            ${{ runner.temp }}/verification/reports/
          if-no-files-found: ignore
          retention-days: 90
