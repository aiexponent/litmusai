# Declaration for case c-06, written from cases/c-06.md and its source passage.
# Fields are true only where the source supports them; template defaults otherwise.
# The system is assumed to be on the EU market with output used in the EU.

name: "Case c-06"
version: "1.0.0"
provider: "A social welfare agency"
deployer: "A social welfare agency"
purpose: "Estimates the risk of benefit fraud."
system_description: |
  A social welfare agency uses an AI system to estimate the risk of fraud by benefit recipients, using only data that is relevant to awarding the benefit and that was lawfully collected for that purpose. The aim is to check that benefits go to the right people.

