# Declaration for case e-02, written from cases/e-02.md and its source passage.
# Fields are true only where the source supports them; template defaults otherwise.
# The system is assumed to be on the EU market with output used in the EU.

name: "Case e-02"
version: "1.0.0"
provider: "A company"
deployer: "A company"
purpose: "Builds a facial recognition database by scraping, one group at a time."
system_description: |
  A company builds a facial recognition database step by step by scraping faces from the internet and CCTV footage, each time choosing a specific group of people or another criterion. Taken together, the result is the same as collecting faces indiscriminately from the start.

deployment_jurisdictions:
  - EU

