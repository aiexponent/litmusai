# Declaration for case h-15, written from cases/h-15.md and its source passage.
# Fields are true only where the source supports them; template defaults otherwise.
# The system is assumed to be on the EU market with output used in the EU.

name: "Case h-15"
version: "1.0.0"
provider: "A provider"
deployer: "A police force"
purpose: "Live facial recognition to find a fleeing terror attacker."
system_description: |
  After a terror attack at a Christmas market that killed 12 people, police use real-time facial recognition to identify the attacker and see where he is fleeing, including cameras at the nearby train station and at stations served by trains that left shortly after the attack.

deployment_jurisdictions:
  - EU

output_consumed_in_eu: true

