# Declaration for case f-13, written from cases/f-13.md and its source passage.
# Fields are true only where the source supports them; template defaults otherwise.
# The system is assumed to be on the EU market with output used in the EU.

name: "Case f-13"
version: "1.0.0"
provider: "A provider"
deployer: "A supermarket or bank"
purpose: "Spots suspicious customers, for example someone about to commit a robbery."
system_description: |
  A supermarket or bank uses AI cameras to spot suspicious customers, for example to conclude that someone is about to commit a robbery. It is ensured that no employees are tracked, and there are sufficient safeguards.

deployment_jurisdictions:
  - EU

output_consumed_in_eu: true

subject_population:
  categories:
    - general_public
  notes: null

inputs:
  biometric: true
  facial_images: true
  emotional_state_inference: true
  behaviour_history: false
  social_behaviour_data: false
  scraped_internet_data: false
  freetext_prompts: false
  other: null

outputs:
  individual_scores: false
  behaviour_predictions: false
  criminal_risk_predictions: false
  emotion_inferences: true  # intentions count as emotions in the guidelines
  sensitive_attribute_classifications: false
  freetext_generations: false
  detrimental_treatment_unrelated_context: false
  other: "inferred intention of customers"

deployment_context:
  workplace: true  # the shop is also a workplace, but only customers are analysed
  education: false
  public_space: true
  real_time_operation: false
  law_enforcement_use: false
  healthcare: false
  financial_services: false
  other: null

generative_media:
  realistic_media_generation: false
  identifiable_persons: false
  intimate_depictions_possible: false
  intimate_depictions_intended: false
  minors_depictions_possible: false
  manipulation_within_1b_only: false
  safeguards:
    consent_demonstrable: false
    intimate_output_prevention: false
    csam_prevention: false
    misuse_correction: false
    documented: false

mitigations:
  - "No employees are tracked"
  - "Sufficient safeguards in place"

metadata:
  last_reviewed: null
  owner: null
  reviewed_by: null
