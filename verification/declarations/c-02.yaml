# Declaration for case c-02, written from cases/c-02.md and its source passage.
# Fields are true only where the source supports them; template defaults otherwise.
# The system is assumed to be on the EU market with output used in the EU.

name: "Case c-02"
version: "1.0.0"
provider: "A migration authority"
deployer: "A migration authority"
purpose: "Surveillance at refugee camps that evaluates migrants over time, for example their risk of absconding."
system_description: |
  A migration and asylum authority runs a partly automated surveillance system at refugee camps, with cameras and motion sensors. The system analyses data gathered over a period of time to evaluate individual migrants, for example to judge whether they are at risk of absconding. Nothing is said about what happens to people as a result.

