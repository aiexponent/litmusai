# Declaration for case c-22, written from cases/c-22.md and its source passage.
# Fields are true only where the source supports them; template defaults otherwise.
# The system is assumed to be on the EU market with output used in the EU.

name: "Case c-22"
version: "1.0.0"
provider: "An online platform"
deployer: "An online platform"
purpose: "Profiles users for safety on the platform."
system_description: |
  An online platform profiles its users for safety on its services, using data relevant to that context and purpose. Any consequences for users are in proportion to how serious their misbehaviour is.

deployment_jurisdictions:
  - EU

output_consumed_in_eu: true

subject_population:
  categories:
    - general_public
  notes: null

inputs:
  biometric: false
  facial_images: false
  emotional_state_inference: false
  behaviour_history: true
  social_behaviour_data: false
  scraped_internet_data: false
  freetext_prompts: false
  other: "data relevant to safety on the service"

outputs:
  individual_scores: true
  behaviour_predictions: false
  criminal_risk_predictions: false
  emotion_inferences: false
  sensitive_attribute_classifications: false
  freetext_generations: false
  detrimental_treatment_unrelated_context: false
  other: null

deployment_context:
  workplace: false
  education: false
  public_space: false
  real_time_operation: false
  law_enforcement_use: false
  healthcare: false
  financial_services: false
  other: null

generative_media:
  realistic_media_generation: false
  identifiable_persons: false
  intimate_depictions_possible: false
  intimate_depictions_intended: false
  minors_depictions_possible: false
  manipulation_within_1b_only: false
  safeguards:
    consent_demonstrable: false
    intimate_output_prevention: false
    csam_prevention: false
    misuse_correction: false
    documented: false

# Article 5(1)(a) and (b): answers added for 1.2.0 from the case description.
influence:
  subliminal_techniques: not_answered
  manipulative_or_deceptive_techniques: not_answered
  exploits_vulnerability: not_answered
  materially_distorts_behaviour: not_answered
  significant_harm_likely: no                             # assumption: proportionate consequences

# Exceptions and limits, points (d) to (h): only questions the case gives facts for.
scope:
  role: deployer
  human_assessment_on_verifiable_facts: not_answered
  untargeted_collection: not_answered
  builds_facial_recognition_database: not_answered
  emotions_of_workers_or_students: not_answered
  medical_or_safety_reasons: not_answered
  dataset_labelling_or_filtering_only: not_answered
  remote_identification: not_answered
  law_enforcement_purpose: not_answered
  article_5_1_h_objective: not_answered

mitigations:
  - "Consequences proportionate to the misbehaviour"

metadata:
  last_reviewed: null
  owner: null
  reviewed_by: null
