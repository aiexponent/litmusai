# Declaration for case b-06, written from cases/b-06.md and its source passage.
# Fields are true only where the source supports them; template defaults otherwise.
# The system is assumed to be on the EU market with output used in the EU.

name: "Case b-06"
version: "1.0.0"
provider: "A provider"
deployer: "A deployer"
purpose: "AI system trained on biased data."
system_description: |
  An AI system was trained on biased data and, without anyone intending it, has a disproportionate negative effect on people in a socially or economically disadvantaged situation. It does not deliberately target them. It is not known whether the provider or deployer is aware of the effect and the likely harm, or whether they have taken corrective measures.

deployment_jurisdictions:
  - EU

output_consumed_in_eu: true

subject_population:
  categories:
    - general_public
  notes: "Has an unintended, disproportionate negative effect on socially or economically disadvantaged people; not targeted at them. Awareness and corrective measures unknown."

