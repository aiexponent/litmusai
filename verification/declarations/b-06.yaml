  manipulative_or_deceptive_techniques: no                # assumption: unintended bias is not a manipulative technique
  exploits_vulnerability: not_sure                        # a disproportionate effect on disadvantaged people, not deliberate
  materially_distorts_behaviour: not_sure
  significant_harm_likely: not_sure

# Exceptions and limits, points (d) to (h): only questions the case gives facts for.
scope:
