# Declaration for case f-35, written from cases/f-35.md and its source passage.
# Fields are true only where the source supports them; template defaults otherwise.
# The system is assumed to be on the EU market with output used in the EU.

name: "Case f-35"
version: "1.0.0"
provider: "A provider"
deployer: "A stadium or station operator"
purpose: "Recognises aggressive behaviour in crowds."
system_description: |
  A system at a football stadium or a central station recognises aggressive behaviour in the crowd. It may also pick up the emotions of security staff working there, although the deployer has safeguards to avoid screening employees and the system is not aimed at them.

deployment_jurisdictions:
  - EU

output_consumed_in_eu: true

subject_population:
